<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MySmartAgenda - Démo API</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <header class="text-center mb-4">
            <h1 class="fw-bold">MySmartAgenda</h1>

            <p class="text-muted">
                Démonstration API REST sécurisée — CRUD complet
            </p>

            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <span class="badge text-bg-primary">API REST</span>
                <span class="badge text-bg-success">JWT</span>
                <span class="badge text-bg-dark">PHP POO</span>
                <span class="badge text-bg-info">MariaDB</span>
                <span class="badge text-bg-secondary">Docker</span>
            </div>
        </header>

        <!-- Connexion -->
        <section class="card shadow-sm mb-4">
            <div class="card-body">

                <h2 class="h4">Connexion</h2>

                <form id="loginForm">
                    <div class="mb-2">
                        <label for="email" class="form-label">
                            Adresse e-mail
                        </label>

                        <input id="email" type="email" class="form-control" value="guillaume@test.fr"
                            autocomplete="username" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Mot de passe
                        </label>

                        <input id="password" type="password" class="form-control" value="Password123"
                            autocomplete="current-password" required>
                    </div>

                    <button id="loginButton" type="submit" class="btn btn-primary">
                        Connexion
                    </button>

                    <button id="logoutButton" type="button" class="btn btn-outline-danger d-none" onclick="logout()">
                        Déconnexion
                    </button>
                </form>

                <div id="loginStatus" class="mt-3"></div>

            </div>
        </section>

        <!-- Rendez-vous -->
        <section id="appointmentsSection" class="card shadow-sm mb-4 d-none">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h2 class="h4 mb-0">Rendez-vous</h2>

                <span id="appointmentsCount" class="badge text-bg-primary">
                    0
                </span>
            </div>

            <div class="card-body">

                <span id="appointmentMode" class="badge text-bg-secondary mb-3">
                    Mode ajout
                </span>

                <div class="mb-2">
                    <label for="appointmentTitle" class="form-label">
                        Titre
                    </label>

                    <input id="appointmentTitle" class="form-control" placeholder="Exemple : Rendez-vous médecin">
                </div>

                <div class="mb-2">
                    <label for="appointmentDescription" class="form-label">
                        Description
                    </label>

                    <input id="appointmentDescription" class="form-control" placeholder="Description du rendez-vous">
                </div>

                <div class="mb-3">
                    <label for="appointmentDate" class="form-label">
                        Date et heure
                    </label>

                    <input id="appointmentDate" type="datetime-local" class="form-control">
                </div>

                <button id="appointmentSubmitButton" class="btn btn-success" onclick="saveAppointment()">
                    Ajouter
                </button>

                <button class="btn btn-outline-secondary ms-2" onclick="resetAppointmentForm()">
                    Annuler
                </button>

                <hr>

                <div id="appointmentsMessage"></div>

                <ul id="appointmentsList" class="list-group"></ul>

            </div>
        </section>

        <!-- Tâches -->
        <section id="tasksSection" class="card shadow-sm d-none">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h2 class="h4 mb-0">Tâches</h2>

                <span id="tasksCount" class="badge text-bg-primary">
                    0
                </span>
            </div>

            <div class="card-body">

                <span id="taskMode" class="badge text-bg-secondary mb-3">
                    Mode ajout
                </span>

                <div class="mb-2">
                    <label for="taskTitle" class="form-label">
                        Titre
                    </label>

                    <input id="taskTitle" class="form-control" placeholder="Exemple : Faire les courses">
                </div>

                <div class="mb-2">
                    <label for="taskDescription" class="form-label">
                        Description
                    </label>

                    <input id="taskDescription" class="form-control" placeholder="Description de la tâche">
                </div>

                <div class="mb-3">
                    <label for="taskStatus" class="form-label">
                        Statut
                    </label>

                    <select id="taskStatus" class="form-select">
                        <option value="TODO">À faire</option>
                        <option value="DONE">Terminée</option>
                    </select>
                </div>

                <button id="taskSubmitButton" class="btn btn-success" onclick="saveTask()">
                    Ajouter
                </button>

                <button class="btn btn-outline-secondary ms-2" onclick="resetTaskForm()">
                    Annuler
                </button>

                <hr>

                <div id="tasksMessage"></div>

                <ul id="tasksList" class="list-group"></ul>

            </div>
        </section>

    </div>

    <script src="/assets/js/demo.js"></script>

</body>

</html>
